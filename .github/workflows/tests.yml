name: tests

on:
  push:
  pull_request:
  # requirements-dev.txt leaves "homeassistant" unpinned, so a new release
  # can break these tests with no commit of ours to trigger them. Run daily
  # to catch that drift instead of discovering it at the next push.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q custom_components tests
      - run: python -m ruff check .
      - run: pytest

  home-assistant-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Home Assistant requires Python >= 3.14.2 from 2026.7.0 onward, so
        # "current" must run on 3.14 - on 3.13 pip silently resolves
        # "homeassistant" back to the last 3.13-compatible release and the
        # job stops testing anything current. The pinned "minimum" stays on
        # 3.13 because 2025.1.4's dependencies predate 3.14 wheels.
        include:
          - label: minimum
            requirement: homeassistant==2025.1.4
            python: "3.13"
          - label: current
            requirement: homeassistant
            python: "3.14"
    name: Home Assistant ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
      - run: python -m pip install --upgrade pip
      # aiousbwatcher/pyserial/serialx: homeassistant.components.bluetooth
      # depends on homeassistant.components.usb, which needs them (pyserial
      # and serialx cover older and newer Home Assistant versions
      # respectively); not pulled in by the "homeassistant" package itself.
      - run: >-
          python -m pip install
          "${{ matrix.requirement }}"
          "bleak-retry-connector"
          "aiousbwatcher"
          "pyserial"
          "serialx"
      # Current Home Assistant no longer declares aiohasupervisor itself,
      # but bluetooth -> usb -> usb.consumers imports hassio, which needs
      # it - same shape as the aiousbwatcher/pyserial gap above. Scoped to
      # "current": 2025.1.4 still pins it (to a pre-release), and asking for
      # it unconstrained there would fight that pin.
      - if: matrix.label == 'current'
        run: python -m pip install aiohasupervisor
      - name: Import integration against Home Assistant
        run: |
          python - <<'PY'
          import custom_components.jackery
          import custom_components.jackery.config_flow
          import custom_components.jackery.coordinator
          import custom_components.jackery.diagnostics
          import custom_components.jackery.sensor
          import custom_components.jackery.binary_sensor
          import custom_components.jackery.switch
          print("Jackery Home Assistant imports passed")
          PY
      # The full pytest-homeassistant-custom-component suite only runs against
      # "current": its fixtures patch internal habluetooth/bluetooth_adapters
      # attributes that shift between Home Assistant generations, so pairing
      # it with the old pinned "minimum" HA below can crash on unrelated
      # test-harness/library drift rather than a real integration bug. The
      # plain import check above is what actually verifies minimum-version
      # compatibility of this integration's own code.
      - if: matrix.label == 'current'
        run: python -m pip install pytest pytest-asyncio pytest-homeassistant-custom-component
      - if: matrix.label == 'current'
        run: pytest
      - run: python -m pip check

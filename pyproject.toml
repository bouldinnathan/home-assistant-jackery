[project]
name = "homeassistant-jackery"
version = "0.1.0"
description = "Home Assistant custom integration for Jackery portable power stations over Bluetooth LE"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
